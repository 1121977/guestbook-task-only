plugins {
    id 'war'
    id "io.spring.dependency-management" version "1.1.7"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = 'ru.incubator'

// SkillTrack repository
repositories {
    maven {
        allowInsecureProtocol = true
        url = "http://nexus:8081/repository/maven-public/"
    }
}

// Global Repository
/*
repositories {
    mavenCentral()
}
*/

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'
    testImplementation 'org.springframework:spring-test:7.0.3'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    implementation "org.springframework.security:spring-security-web"
    implementation "org.springframework.security:spring-security-config"
    implementation "org.springframework.security:spring-security-core"
    implementation "org.springframework:spring-jdbc"
    implementation group: 'org.flywaydb', name: 'flyway-core', version: '12.0.0'
    implementation 'org.springframework:spring-orm:7.0.3'
    implementation 'org.freemarker:freemarker:2.3.34'
    implementation 'org.springframework:spring-context-support:7.0.3'
    implementation 'com.h2database:h2:2.4.240'
    implementation 'org.springframework:spring-webmvc:7.0.3'
    implementation 'org.hibernate.orm:hibernate-core:7.2.2.Final'
    implementation group: 'no.api.freemarker', name: 'freemarker-java8', version: '3.0.3'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.security:spring-security-bom:7.0.2'
    }
}

test {
    useJUnitPlatform()
}

war {
    archiveBaseName = 'guestbook'
}

tasks.register('buildAndCopyWarToApache', Copy) {
    from war // shortcut for createJar.outputs.files
    into "/opt/apache-tomcat-11.0.18/webapps"
    dependsOn(war)
}

